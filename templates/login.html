{% from 'bootstrap5/form.html' import render_form %}
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Taskly - Login</title>
    <link href="../static/logo.ico" rel="icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="d-flex flex-column align-items-center justify-content-center py-4 bg-body-tertiary"
      style="min-height: 100vh;">
<div class="container col-md-4 p-4 border rounded shadow-sm bg-dark">
    <h1 class="h3 mb-3 fw-normal text-center">Log In to Taskly</h1>
    {{ render_form(form) }}
    <div class="text-center mt-3">
        <a href="{{ url_for('register') }}" class="btn btn-link">Don't have an account yet? Register now!</a>
    </div>
</div>
{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="container col-md-4 mt-3">
    {% for message in messages %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}
</body>
</html>
