{% from 'bootstrap5/form.html' import render_form %}
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Taskly</title>
    <link href="../static/logo.ico" rel="icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Taskly</a>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link active" href="#">Home</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Log Out</a>
            </div>
        </div>
    </div>
</nav>
<div class="container py-5 text-center">
    <h1>Hey there, {{ user }}</h1>
    <p class="lead">Start managing your tasks.</p>
</div>
<div class="container col-md-6 border rounded p-4 mb-5">
    {{ render_form(form) }}
</div>
<div class="container col-md-6 mb-5">
    <h3>Your Todo List</h3>
    <ul class="list-group">
        {% for task in tasks %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span style="{{ 'text-decoration: line-through; opacity: 0.6;' if task[ 2 ] == 'Completed' else '' }}">
                {{ task[ 1 ] }}
            </span>
            <div>
                <form action="{{ url_for('toggle_task', task_id=task[ 0 ]) }}" method="POST" class="d-inline">
                    <button type="submit" class="btn btn-sm {{ 'btn-secondary' if task[ 2 ] == 'Completed' else 'btn-success' }}">
                        {{ 'Mark Pending' if task[ 2 ] == 'Completed' else 'Mark Complete' }}
                    </button>
                </form>
                <form action="{{ url_for('delete_task', task_id=task[ 0 ]) }}" method="POST" class="d-inline ms-1">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </div>
        </li>
        {% else %}
        <li class="list-group-item text-center text-muted">No tasks added yet.</li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
